<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rate your session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#3730A3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F8; font-family: 'Manrope', system-ui, sans-serif; color: #151A2D; display: flex; flex-direction: column; padding: 16px 20px 24px; gap: 18px; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E5EE; display: flex; align-items: center; justify-content: center; color: #151A2D">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #5A6178">Review session</span>
    <span style="width: 44px"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Welcome back</h1>
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="36" height="16" viewBox="0 0 36 16" role="img" aria-label="Green belt, 2 stripes"><rect x="1" y="4" width="34" height="8" rx="2" fill="#639922"/><rect x="13" y="1.5" width="10" height="13" rx="2.5" fill="#4E7A1B"/><rect x="28" y="4" width="2" height="8" fill="#151A2D"/><rect x="31.5" y="4" width="2" height="8" fill="#151A2D"/></svg>
      <span style="font-size: 15px; font-weight: 600">Thermodynamics, 2nd law</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E2E5EE; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label style="font-size: 13px; font-weight: 700">Where did you stop?</label>
        <span style="font-size: 12px; color: #5A6178">HC Verma Vol 2 · pp. 210–228</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <button type="button" aria-label="Previous page" onClick="{{dec}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E5EE; background: #F3F4F8; font-size: 20px; font-weight: 700; color: #151A2D">−</button>
        <span style="min-width: 56px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">p. {{page}}</span>
        <button type="button" aria-label="Next page" onClick="{{inc}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E5EE; background: #F3F4F8; font-size: 20px; font-weight: 700; color: #151A2D">+</button>
      </div>
    </div>
    <div style="height: 6px; border-radius: 999px; background: #E8EAF2; overflow: hidden; display: flex">
      <div style="width: {{pct}}%; background: #4338CA; border-radius: 999px"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; color: #5A6178">{{rangeNote}}</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5A6178" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
        22 min
      </span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">How well could you recall it?</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{ratings}}" as="r" hint-placeholder-count="4">
        <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="min-height: 72px; border-radius: 16px; border: {{r.border}}; background: {{r.bg}}; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 10px 14px; font-family: inherit; text-align: left">
          <span style="font-size: 16px; font-weight: 700; color: {{r.fg}}">{{r.label}}</span>
          <span style="font-size: 12px; color: {{r.sub}}">{{r.next}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{rated}}" hint-placeholder-val="{{ false }}">
    <div style="background: #151A2D; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
      <svg width="64" height="28" viewBox="0 0 64 28" role="img" aria-label="{{res.aria}}"><rect x="2" y="9" width="60" height="10" rx="3" fill="{{res.belt}}"/><rect x="24" y="4" width="16" height="20" rx="4" fill="{{res.knot}}"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; color: #FFFFFF">{{res.title}}</span>
        <span style="font-size: 13px; color: #D5D9E8">{{res.sub}}</span>
      </div>
    </div>
  </sc-if>

  <div style="flex-grow: 1"></div>

  <a href="Main.dc.html" style="text-decoration: none; min-height: 52px; border-radius: 16px; background: {{doneBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{doneLabel}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 228, rated: null };
  }
  renderVals() {
    const page = this.state.page;
    const rated = this.state.rated;
    const defs = [
      { id: 'forgot', label: 'Forgot', next: 'Back tomorrow' },
      { id: 'hard', label: 'Hard', next: 'Next in 3 days' },
      { id: 'good', label: 'Good', next: 'Next in 9 days' },
      { id: 'easy', label: 'Easy', next: 'Next in 18 days' }
    ];
    const ratings = defs.map((d) => {
      const on = rated === d.id;
      return {
        label: d.label,
        next: d.next,
        pressed: on ? 'true' : 'false',
        bg: on ? '#4338CA' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#151A2D',
        sub: on ? '#E0E3FF' : '#5A6178',
        border: on ? '2px solid #4338CA' : '1px solid #E2E5EE',
        pick: () => this.setState({ rated: d.id })
      };
    });
    const results = {
      forgot: { title: 'Green belt, one stripe lost', sub: '+10 XP · we will revisit it tomorrow', belt: '#639922', knot: '#4E7A1B', aria: 'Green belt' },
      hard: { title: 'Green belt holds', sub: '+20 XP · stripe kept', belt: '#639922', knot: '#4E7A1B', aria: 'Green belt' },
      good: { title: 'Promoted to Blue belt', sub: '+40 XP · quest "Earn a promotion" done', belt: '#378ADD', knot: '#2563B5', aria: 'Blue belt' },
      easy: { title: 'Promoted to Blue belt', sub: '+50 XP · next review in 18 days', belt: '#378ADD', knot: '#2563B5', aria: 'Blue belt' }
    };
    return {
      page: page,
      pct: Math.round(((page - 210) / 18) * 100),
      rangeNote: page >= 228 ? 'Finished the whole range' : (228 - page) + ' pages left for next time',
      dec: () => this.setState({ page: Math.max(210, page - 1) }),
      inc: () => this.setState({ page: Math.min(228, page + 1) }),
      ratings: ratings,
      rated: !!rated,
      res: rated ? results[rated] : results.good,
      doneBg: rated ? '#4338CA' : '#9CA2B8',
      doneLabel: rated ? 'Done · back to Today' : 'Pick a rating to finish'
    };
  }
}
</script>
</body>
</html>
