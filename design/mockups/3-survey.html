<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Source survey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#3730A3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F8; font-family: 'Manrope', system-ui, sans-serif; color: #151A2D; display: flex; flex-direction: column; padding: 16px 20px 24px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E5EE; display: flex; align-items: center; justify-content: center; color: #151A2D; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 12px; font-weight: 600; color: #5A6178">Scouting the terrain</span>
      <span style="font-size: 16px; font-weight: 700">HC Verma Vol 1</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between">
      <span style="font-size: 13px; font-weight: 600">Chapter 8 of 22</span>
      <span style="font-size: 13px; color: #5A6178">about 2 min left</span>
    </div>
    <div style="height: 6px; border-radius: 999px; background: #E2E5EE; overflow: hidden; display: flex">
      <div style="width: 36%; background: #4338CA; border-radius: 999px"></div>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E2E5EE; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: #4338CA">CHAPTER 8</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.3px">Work and Energy</h1>
      <span style="font-size: 13px; color: #5A6178">pp. 130–158 · 29 pages</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 700">Importance for JEE Main</span>
        <span style="font-size: 11px; font-weight: 600; color: #4338CA; background: #EEF0FF; border-radius: 999px; padding: 3px 8px">from template</span>
      </div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{imp}}" as="c" hint-placeholder-count="3">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: 1 1 0; min-height: 44px; border-radius: 12px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; font-weight: 700">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 700">How hard does it look?</span>
        <span style="font-size: 11.5px; color: #5A6178">others said Medium</span>
      </div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{dif}}" as="c" hint-placeholder-count="3">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: 1 1 0; min-height: 44px; border-radius: 12px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; font-weight: 700">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Studied it before?</span>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{fam}}" as="c" hint-placeholder-count="3">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: 1 1 0; min-height: 44px; border-radius: 12px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 13.5px; font-weight: 700">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="background: #F3F4F8; border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5A6178">First read</span>
        <span style="font-size: 17px; font-weight: 700">≈ {{est}}</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span style="font-size: 12px; color: #5A6178">Target</span>
        <div style="display: flex; align-items: center; gap: 6px">
          <svg width="32" height="14" viewBox="0 0 32 14" aria-hidden="true"><rect x="1" y="3.5" width="30" height="7" rx="2" fill="{{target.color}}" stroke="#151A2D" stroke-opacity="0.15"/><rect x="11.5" y="1" width="9" height="12" rx="2.5" fill="{{target.knot}}"/></svg>
          <span style="font-size: 14px; font-weight: 700">{{target.name}}</span>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <button type="button" style="align-self: center; min-height: 44px; border: 0; background: none; font-family: inherit; font-size: 14px; font-weight: 600; color: #4338CA">Mark the other 14 as Medium</button>

  <div style="display: flex; gap: 10px">
    <button type="button" style="flex: 1 1 0; min-height: 52px; border-radius: 16px; border: 1px solid #E2E5EE; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #151A2D">Previous</button>
    <button type="button" style="flex: 2 1 0; min-height: 52px; border-radius: 16px; border: 0; background: #4338CA; font-family: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF">Next chapter</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { imp: 'High', dif: 'Hard', fam: 'Seen it' };
  }
  chips(key, labels) {
    const cur = this.state[key];
    return labels.map((label) => {
      const on = cur === label;
      return {
        label: label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#151A2D' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#151A2D',
        border: on ? '1.5px solid #151A2D' : '1px solid #D6DAE6',
        pick: () => this.setState({ [key]: label })
      };
    });
  }
  renderVals() {
    const perPage = { Easy: 2, Medium: 3, Hard: 4 }[this.state.dif];
    const famF = { 'New': 1, 'Seen it': 0.7, 'Comfortable': 0.45 }[this.state.fam];
    const mins = Math.round((29 * perPage * famF) / 5) * 5;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    const est = (h ? h + ' h ' : '') + (m ? m + ' min' : '');
    const targets = {
      High: { name: 'Black belt', color: '#2C2C2A', knot: '#000000' },
      Medium: { name: 'Blue belt', color: '#378ADD', knot: '#2563B5' },
      Low: { name: 'Green belt', color: '#639922', knot: '#4E7A1B' }
    };
    return {
      imp: this.chips('imp', ['High', 'Medium', 'Low']),
      dif: this.chips('dif', ['Easy', 'Medium', 'Hard']),
      fam: this.chips('fam', ['New', 'Seen it', 'Comfortable']),
      est: est.trim(),
      target: targets[this.state.imp]
    };
  }
}
</script>
</body>
</html>
