name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the development toolchain (docs/07-decisions.md, D1).
  FLUTTER_VERSION: 3.41.6

jobs:
  check:
    name: Analyze, import rules, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install SQLite for Drift tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Generated code is committed and current
        run: |
          dart run build_runner build
          flutter gen-l10n
          dart run drift_dev make-migrations
          git diff --exit-code -- lib test drift_schemas

      - run: dart format --output=none --set-exit-if-changed lib test tool

      - run: flutter analyze

      - name: Import rules (engines stay pure Dart; screens never touch the database)
        run: dart run tool/check_imports.dart

      # Goldens are compared on Windows, where they are recorded.
      - run: flutter test --exclude-tags golden

  goldens:
    name: Golden tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter test --tags golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
