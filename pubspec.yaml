name: prepbelt
description: "PrepBelt: offline exam preparation, belt by belt."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  crypto: 3.0.8
  drift: 2.31.0
  drift_flutter: 0.2.0
  file_picker: 10.3.3
  flutter:
    sdk: flutter
  flutter_animate: 4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.2.1
  freezed_annotation: 3.1.0
  go_router: 17.5.0
  intl: 0.20.2
  open_filex: 4.7.0
  json_annotation: 4.11.0
  path: 1.9.1
  path_provider: 2.1.6
  pdfrx: 2.4.7
  riverpod_annotation: 4.0.2
  url_launcher: 6.3.2
  uuid: 4.6.0
  # Patched copy: third_party/receive_sharing_intent/PATCHES.md
  receive_sharing_intent:
    path: third_party/receive_sharing_intent
  flutter_local_notifications: 22.3.2
  timezone: 0.11.1
  flutter_timezone: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  riverpod_generator: 4.0.3
  drift_dev: 2.31.0
  freezed: 3.2.5
  json_serializable: 6.13.0
  build_runner: 2.15.1
  sqlite3: 2.9.4
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
