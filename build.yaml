targets:
  $default:
    builders:
      # Drift writes its own part file (not a shared .g.dart part), so the
      # row classes exist before riverpod_generator reads providers that
      # return them.
      drift_dev:
        enabled: false
      drift_dev:not_shared:
        enabled: true
        options: &drift_options
          store_date_time_values_as_text: false
          databases:
            app_database: lib/core/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
      drift_dev:preparing_builder:
        enabled: true
        options: *drift_options

global_options:
  drift_dev:not_shared:
    runs_before:
      - riverpod_generator:riverpod_generator
